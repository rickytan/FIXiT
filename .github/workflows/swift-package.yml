name: Swift Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate package manifest
        run: swift package describe

      - name: Select iOS simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[]
             | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
             | .value[] | select(.isAvailable and (.name | startswith("iPhone")))]
            | first | .udid
          ')"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Test Swift package
        run: |
          mkdir -p "$RUNNER_TEMP/FIXiTPackage"
          cp -R Package.swift FIXIT Tests "$RUNNER_TEMP/FIXiTPackage/"
          cd "$RUNNER_TEMP/FIXiTPackage"
          xcodebuild test \
            -scheme FIXiT-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/FIXiTPackageBuild" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test app integration
        run: |
          xcodebuild test \
            -project Tests/SwiftPackageHost/FIXiTPackageHost.xcodeproj \
            -scheme FIXiTPackageHost \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/FIXiTHostBuild" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS devices
        run: |
          xcodebuild build \
            -project Tests/SwiftPackageHost/FIXiTPackageHost.xcodeproj \
            -scheme FIXiTPackageHost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FIXiTHostBuild" \
            CODE_SIGNING_ALLOWED=NO
          cmp \
            "$RUNNER_TEMP/FIXiTHostBuild/Build/Products/Release-iphoneos/FIXiT_FIXiT.bundle/FIXiT.bundle/fixit.js" \
            "$RUNNER_TEMP/FIXiTHostBuild/Build/Products/Release-iphoneos/FIXiTPackageHost.app/FIXiT.bundle/fixit.js"
